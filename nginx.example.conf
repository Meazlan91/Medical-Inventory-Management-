# Example Nginx config for MediStock with HTTPS
# 1. Install certbot and get certificate
# 2. Copy this to /etc/nginx/sites-available/medistock
# 3. ln -s /etc/nginx/sites-available/medistock /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-shop-domain.com;   # or use IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-shop-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-shop-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-shop-domain.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
