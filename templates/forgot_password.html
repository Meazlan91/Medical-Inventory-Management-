<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MediStock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:linear-gradient(135deg,#0f172a 0%,#1E1B4B 50%,#4F46E5 100%)}
        .card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
        .logo{text-align:center;margin-bottom:24px}
        .logo-icon{font-size:40px;margin-bottom:6px}
        h1{font-size:22px;color:#1E1B4B;text-align:center;margin-bottom:4px}
        .sub{color:#64748b;font-size:13px;text-align:center;margin-bottom:24px}
        .form-group{margin-bottom:16px}
        label{display:block;font-size:13px;font-weight:600;color:#64748b;margin-bottom:6px}
        input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit}
        input:focus{outline:none;border-color:#4F46E5;box-shadow:0 0 0 3px #E0E7FF}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#4F46E5,#3730A3);color:#fff;border:none;
             border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
        .btn:hover{opacity:.95}
        .error{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
        .error.show{display:block}
        .hint{text-align:center;margin-top:20px;font-size:12px;color:#94a3b8;line-height:1.6}
        .hint a{color:#4F46E5;text-decoration:none;font-weight:600}
        .info{background:#f0fdfa;color:#312E81;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:16px}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">💊</div>
            <h1>Reset Password</h1>
            <p class="sub">Enter your details to set a new password</p>
        </div>
        <div class="info">Recovery Code default: <strong>RECOVER123</strong></div>
        <div id="error" class="error {% if error %}show{% endif %}">{{ error or '' }}</div>
        <form id="form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" value="admin" required>
            </div>
            <div class="form-group">
                <label>Recovery Code</label>
                <input type="text" id="recovery_code" placeholder="Enter recovery code" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new_password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirm_password" required minlength="6">
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <div class="hint">
            <a href="/login">← Back to Login</a>
        </div>
    </div>
    <script>
        document.getElementById('form').addEventListener('submit', async e => {
            e.preventDefault();
            const err = document.getElementById('error');
            err.classList.remove('show');
            const payload = {
                username: document.getElementById('username').value.trim(),
                recovery_code: document.getElementById('recovery_code').value.trim(),
                new_password: document.getElementById('new_password').value,
                confirm_password: document.getElementById('confirm_password').value
            };
            if (payload.new_password !== payload.confirm_password) {
                err.textContent = 'Passwords do not match';
                err.classList.add('show');
                return;
            }
            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                alert('Password reset successful! Please login.');
                window.location.href = '/login';
            } catch (ex) {
                err.textContent = ex.message;
                err.classList.add('show');
            }
        });
    </script>
</body>
</html>
