<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - MediStock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:linear-gradient(135deg,#0f172a 0%,#1E1B4B 50%,#4F46E5 100%)}
        .card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
        h1{font-size:22px;margin-bottom:6px;color:#1E1B4B}
        .sub{color:#64748b;font-size:13px;margin-bottom:24px}
        .warn{background:#fef3c7;color:#92400e;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
        .form-group{margin-bottom:16px}
        label{display:block;font-size:13px;font-weight:600;color:#64748b;margin-bottom:6px}
        input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit}
        input:focus{outline:none;border-color:#4F46E5;box-shadow:0 0 0 3px #E0E7FF}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#4F46E5,#3730A3);color:#fff;border:none;
             border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
        .btn:hover{opacity:.95}
        .error{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
        .error.show{display:block}
    </style>
</head>
<body>
    <div class="card">
        <h1>Change Password</h1>
        <p class="sub">{% if forced %}You must set a new password before continuing.{% else %}Update your account password.{% endif %}</p>
        {% if forced %}<div class="warn">For security, please change the default password now.</div>{% endif %}
        <div id="error" class="error"></div>
        <form id="form">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="current" required {% if forced %}value="admin123"{% endif %}>
            </div>
            <div class="form-group">
                <label>New Password (min 8 characters)</label>
                <input type="password" id="new" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirm" required minlength="8">
            </div>
            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>
    <script>
        document.getElementById('form').addEventListener('submit', async e => {
            e.preventDefault();
            const neu = document.getElementById('new').value;
            const conf = document.getElementById('confirm').value;
            const err = document.getElementById('error');
            err.classList.remove('show');
            if (neu !== conf) { err.textContent = 'Passwords do not match'; err.classList.add('show'); return; }
            if (neu.length < 8) { err.textContent = 'Password must be at least 8 characters'; err.classList.add('show'); return; }
            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        current_password: document.getElementById('current').value,
                        new_password: neu
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                window.location.href = '/';
            } catch (ex) {
                err.textContent = ex.message;
                err.classList.add('show');
            }
        });
    </script>
</body>
</html>
